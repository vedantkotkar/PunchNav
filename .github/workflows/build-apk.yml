name: Build PunchNav APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant Execute Permission for Gradlew
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PunchNav-Release-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/')
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        name: PunchNav v1.0.0 (Build ${{ github.run_number }})
        body: |
          ### 🎉 PunchNav Ready-to-Install APK
          Turn-by-turn navigation HUD for Tata Punch 3.5" monochrome LCD.
          
          **How to install:**
          1. Download `PunchNav.apk` directly on your Android phone.
          2. Tap install.
          3. Open the app and tap **Grant Notification Access**.
          4. Connect phone to your car's Bluetooth and start driving with Google Maps!
        files: |
          app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
