name: Build PunchNav APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Wrapper & Build APK
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PunchNav-Release-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: PunchNav v1.0.0 Ready APK
        body: |
          ### 🚗 PunchNav Ready-to-Install APK
          Turn-by-turn navigation HUD for Tata Punch 3.5" center screen.
          
          **Installation:**
          1. Download `app-release.apk` directly on your Android phone.
          2. Install and grant Notification Access.
          3. Connect to your car's Bluetooth and start driving!
        files: |
          app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
