name: Build PunchNav APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Wrapper & Build APK
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug assembleRelease --stacktrace
        cp app/build/outputs/apk/debug/app-debug.apk ./PunchNav.apk
        cp app/build/outputs/apk/release/app-release.apk ./PunchNav-release.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PunchNav-APK
        path: PunchNav.apk

    - name: Update GitHub Release with APKs
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.1
        name: PunchNav v1.0.1
        body: |
          ### 🚗 PunchNav Ready-to-Install APK
          Turn-by-turn navigation HUD for Tata Punch 3.5" center screen.
          
          **Installation:**
          * **Recommended (Universal Install):** Download `PunchNav.apk` directly on your Android phone.
          * If Play Protect prompts you, tap **"More details" -> "Install anyway"**.
          * Open the app and grant **Notification Access**.
        files: |
          PunchNav.apk
          PunchNav-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
